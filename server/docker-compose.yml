# Développement : `npm run dev` (pas besoin de Docker)
# Production    : `docker compose --profile prod up -d --build`
#                 + `--profile tunnel` pour lancer son propre Cloudflare Tunnel (TUNNEL_TOKEN dans .env).
#                 Pour passer par un tunnel déjà en place (ex. celui du bot musique), voir
#                 docker-compose.override.example.yml.
services:
  olydiscord:
    profiles: [prod]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      # base SQLite + fichiers : c'est ce dossier qui grossit (à mettre sur le disque qui a de la place)
      - ./data:/app/data
    ports:
      - "127.0.0.1:8787:8787" # jamais exposé publiquement : l'accès passe par Cloudflare Tunnel

  # Expose PUBLIC_URL en HTTPS sans ouvrir de port sur la box.
  # Dans le tableau de bord Cloudflare : nom public → http://olydiscord:8787
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [olydiscord]
